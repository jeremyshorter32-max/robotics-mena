name: Deploy site

on:
  push:
    branches: [main]
    paths-ignore:
      - 'monitoring/**'   # categorization monitor history; not part of the site
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build (public since launch, 13 Nov 2026)
        run: ./scripts/build-site.sh
        env:
          PUBLIC_LAUNCH: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Tell search engines about the pages (IndexNow)
        run: sleep 30 && node scripts/indexnow.mjs
        continue-on-error: true
