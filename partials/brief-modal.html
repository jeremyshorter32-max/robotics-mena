<sc-if value="{{ briefOpen }}" hint-placeholder-val="{{ false }}">
  <style>
  @keyframes rmBriefFade{from{opacity:0}to{opacity:1}}
  @keyframes rmBriefIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){#rm-brief,#rm-brief-panel{animation:none!important}}
  #rm-brief-email:focus{outline:2px solid var(--accent-text);outline-offset:1px}
  </style>
  <div id="rm-brief" onClick="{{ closeBrief }}" style="position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;background:rgba(18,33,43,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:rmBriefFade .18s ease-out">
    <div id="rm-brief-panel" role="dialog" aria-modal="true" aria-labelledby="rm-brief-h" onClick="{{ keepBrief }}" onKeyDown="{{ briefKey }}" style="position:relative;width:100%;max-width:520px;background:var(--bg-glass);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);border:1px solid var(--line-strong);border-top:3px solid var(--accent);border-radius:4px;box-shadow:0 24px 64px rgba(18,33,43,.28);padding:32px;display:flex;flex-direction:column;gap:16px;animation:rmBriefIn .22s cubic-bezier(.2,.8,.3,1)">
      <button type="button" onClick="{{ closeBrief }}" aria-label="{{ t.close }}" style="position:absolute;top:12px;inset-inline-end:12px;width:36px;height:36px;border:1px solid var(--line-strong);border-radius:3px;background:transparent;color:var(--fg-muted);cursor:pointer;font-size:14px">✕</button>
      <span style="font:500 12px/16px var(--font-label);letter-spacing:var(--label-track);text-transform:var(--label-case);color:var(--accent-text)">{{ t.briefKicker }}</span>
      <h2 id="rm-brief-h" style="margin:0;padding-inline-end:40px;font-size:28px;line-height:1.15;font-weight:600;letter-spacing:var(--track-tight)">{{ t.nlTitle }}</h2>
      <p style="margin:0;font-size:16px;line-height:1.55;color:var(--fg-muted)">{{ t.nlDek }}</p>
      <sc-if value="{{ notSubscribed }}">
        <form onSubmit="{{ subscribeBrief }}" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
          <label style="flex:1;min-width:200px"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">{{ t.nlPh }}</span><input id="rm-brief-email" type="email" required="{{ true }}" autocomplete="email" value="{{ email }}" onChange="{{ onEmail }}" placeholder="{{ t.nlPh }}" style="width:100%;height:48px;padding:0 14px;background:var(--bg-raised);border:1px solid var(--line-strong);border-radius:3px;font-size:16px;color:var(--fg)"></label>
          <button type="submit" style="height:48px;padding:0 24px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:3px;font-size:15px;font-weight:600;cursor:pointer">{{ t.nlBtn }}</button>
        </form>
        <span style="font:400 12px/1.5 var(--font-num);color:var(--fg-subtle)">{{ t.nlMeta }}</span>
        <div style="display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);background:var(--bg-raised);border-radius:3px;font-size:13px;line-height:1.5;color:var(--fg-muted)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:2px;color:var(--sand)"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.3-7.5 9.5-4.3-1.2-7.5-4.9-7.5-9.5V6z"/><path d="M8.8 12l2.2 2.2 4.2-4.4"/></svg><span><strong style="color:var(--fg);font-weight:600">{{ t.privTitle }}</strong> {{ t.privBody }} <a href="{{ privHref }}" style="color:var(--accent-text);border-bottom:1px solid currentColor;white-space:nowrap">{{ privLbl }}</a></span></div>
      </sc-if>
      <sc-if value="{{ subscribed }}">
        <div role="status" style="display:flex;gap:12px;align-items:flex-start;padding:16px;border:1px solid var(--accent);background:var(--bg-raised)"><span aria-hidden="true" style="width:8px;height:8px;margin-top:8px;flex:none;transform:rotate(45deg);background:var(--accent)"></span><span style="font-size:15px;line-height:1.5">{{ t.nlDone }}</span></div>
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px">
          <button type="button" onClick="{{ closeBrief }}" style="height:40px;padding:0 18px;background:transparent;border:1px solid var(--line-strong);border-radius:3px;font-size:14px;color:var(--fg);cursor:pointer">{{ t.briefBack }}</button>
          <button type="button" onClick="{{ resetSignup }}" style="height:40px;padding:0;background:transparent;border:0;font-size:14px;color:var(--accent-text);text-decoration:underline;text-underline-offset:3px;cursor:pointer">{{ t.briefReset }}</button>
        </div>
      </sc-if>
      <span style="font-size:12px;color:var(--fg-subtle)">{{ t.gateNote }}</span>
    </div>
  </div>
</sc-if>
